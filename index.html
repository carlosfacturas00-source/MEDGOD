:root{--bg:#fff;--bg2:#f4f4f7;--tx:#1d1d22;--mu:#6c6c78;--bd:#dcdce4;--ac:#6d4aff;--hv:#e9e6fb;--ok:#1f9d55;--wr:#d98a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1e1e;--bg2:#161616;--tx:#dcdcde;--mu:#8a8a93;--bd:#333338;--ac:#9a82ff;--hv:#2b2840;--ok:#4cc283;--wr:#e5b84a}}
:root[data-theme="dark"]{--bg:#1e1e1e;--bg2:#161616;--tx:#dcdcde;--mu:#8a8a93;--bd:#333338;--ac:#9a82ff;--hv:#2b2840;--ok:#4cc283;--wr:#e5b84a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100%;position:relative}
#side{width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column}
#side h1{font-size:15px;margin:0;padding:14px 14px 6px}
.row{display:flex;gap:6px;padding:4px 12px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:var(--hv)}
button.p,button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;width:100%}
#tree{flex:1;overflow:auto;padding:6px 6px 20px}
details>summary{cursor:pointer;padding:3px 6px;border-radius:5px;list-style:none;color:var(--mu)}
details>summary:hover{background:var(--hv)}
.ind{margin-left:12px;border-left:1px solid var(--bd);padding-left:4px}
.it{padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it:hover{background:var(--hv)}.it.sel{background:var(--hv);color:var(--ac);font-weight:600}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:8px 8px 2px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#bar>button,#bar>span{flex:none}
#title{flex:1 1 40px;min-width:40px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.hs #side{display:none}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
#view{flex:1;position:relative;overflow:auto;min-height:0}
.empty{max-width:480px;margin:12vh auto;text-align:center;color:var(--mu);padding:0 16px}
.pdfw{margin:0 auto;padding:12px;width:min(900px,100%)}
.pg{background:#fff;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);width:100%}
.pg canvas{display:block;width:100%;height:auto}
iframe.h{width:100%;height:100%;border:0;background:#fff;display:block}
.fl{position:absolute;top:8px;right:18px;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#ep{position:absolute;inset:0}
pre.t{margin:0;padding:18px;white-space:pre-wrap;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;max-width:860px}
.split{display:flex;height:100%}
.split>*{flex:1 1 0;min-width:0;min-height:0}
.gut{flex:0 0 7px!important;min-width:7px;cursor:col-resize;background:var(--bd);transition:background .15s}.gut:hover,body.drag .gut{background:var(--ac)}body.drag{user-select:none}body.drag webview,body.drag iframe{pointer-events:none}
.pane{position:relative;overflow:auto;border-right:1px solid var(--bd)}
.note{display:flex;flex-direction:column;padding:12px;gap:8px}
.note-editor{flex:1;min-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:12px;line-height:1.65;background:var(--bg);outline:none}.note-editor:empty:before{content:attr(data-placeholder);color:var(--mu);pointer-events:none}.note-tools{display:flex;gap:4px;flex-wrap:wrap}.note-tools button{min-width:34px}.note-tools .sep{width:1px;background:var(--bd);margin:3px 4px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
#card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:min(720px,100%);max-height:100%;overflow:auto;padding:16px}
#card label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0}
.q .a{color:var(--ok);margin-top:3px}
.it{display:flex;gap:6px}.it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.x{opacity:0;color:#d33;font-size:12px;font-weight:400}.it:hover .x{opacity:1}
@media(hover:none){.x{opacity:.7}}
#pbw{height:3px;background:var(--bd)}#pbi{display:block;height:100%;width:0;background:var(--ac)}
.pg{position:relative}
.textLayer{position:absolute;left:0;top:0;transform-origin:0 0;line-height:1;z-index:2}
.textLayer .endOfContent{display:block;position:absolute;left:0;right:0;top:100%;bottom:0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(80,120,255,.35)}
#hlp{position:fixed;z-index:25;display:none;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}#hlp.on{display:flex}
.hl{position:absolute;pointer-events:none;border-radius:2px;z-index:1}
#plan{display:none;flex:1;overflow:auto;padding:14px;min-height:0}
#plan>*{max-width:820px}
.fb{display:inline-block!important;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px!important;cursor:pointer;margin:0!important;color:var(--tx)!important;font-size:14px!important}
#hlb button{padding:3px 7px}.xd{float:right;padding:0 6px}
@media(max-width:760px){
#side{position:absolute;z-index:10;height:100%;transform:translateX(-100%);transition:transform .2s}
body.sb #side{transform:none}body.hs #side{display:flex}
.split{flex-direction:column}.pane{border-right:0;border-bottom:1px solid var(--bd)}}
.pn{opacity:0;font-size:11px;font-weight:400;cursor:pointer;filter:grayscale(1)}.it:hover .pn{opacity:.8}.pn.on{opacity:1;filter:none}
.it.dt{box-shadow:0 -2px 0 var(--ac)}.it.db{box-shadow:0 2px 0 var(--ac)}.it[draggable]{cursor:grab}
.note-tools select{width:auto;padding:3px 4px}
.of{min-height:100%}.ofb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:3}
.dx{max-width:860px;margin:12px auto;min-height:60vh;background:#fff;color:#222;padding:40px 48px;font:16px/1.55 Calibri,Arial,sans-serif;outline:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}.dx table{border-collapse:collapse}.dx td,.dx th{border:1px solid #aaa;padding:4px 8px}.dx img{max-width:100%}
.xg{overflow:auto;padding:0 10px 20px}.xg table{border-collapse:collapse;font-size:13px}.xg td,.xg th{border:1px solid var(--bd);padding:2px 6px;min-width:70px;height:24px;white-space:pre}.xg th{background:var(--bg2);color:var(--mu);font-weight:500;position:sticky;top:0}.xg td:focus{outline:2px solid var(--ac);outline-offset:-2px;background:var(--hv)}
.pp{padding:4px 6px;margin:4px 0;border-radius:5px;border:1px dashed transparent}.pp:hover,.pp:focus{border-color:var(--bd);outline:none;background:var(--bg)}
.pane{contain:layout paint style}.note{overflow:auto}
.note-editor h1{font-size:1.7em;font-weight:400;margin:.5em 0 .3em}.note-editor h2{font-size:1.4em;font-weight:400;margin:.5em 0 .3em}.note-editor h3{font-size:1.15em;font-weight:400;margin:.5em 0 .3em}
summary.fs{display:flex;gap:6px;align-items:center}summary.fs>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}summary.fs .fb2{opacity:0;font-size:12px;font-weight:400;cursor:pointer}summary.fs:hover .fb2{opacity:.85}
.dh{background:var(--hv);outline:1px dashed var(--ac)}
[contenteditable="true"] span.mk{color:#111;border-radius:2px}.note-tools{gap:6px 4px;align-items:center}.note-tools .tg{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;padding-right:8px;margin-right:2px;border-right:1px solid var(--bd)}.note-tools .tg:last-child{border:0}
summary.fs:hover .fb2,summary:hover>.fb2{opacity:.85}summary>.fb2{opacity:0;cursor:pointer;font-size:12px;font-weight:400}.sec button:hover{opacity:1}

/* === rediseño barra de formato, nota y navegación === */
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button.ib{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.danger{color:#d33}button.danger:hover{background:rgba(211,51,51,.12)}
#bBack{padding:5px 8px}#bar #title{text-align:center;margin:0 28px}
.note-tools{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px}
.note-tools .rw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note-tools .tg,.ttg{display:flex;gap:1px;align-items:center;flex-wrap:nowrap;padding:3px;margin:0;background:var(--bg);border:1px solid var(--bd);border-radius:9px}
.note-tools .tg:last-child{border:1px solid var(--bd)}
.note-tools .tg button,.ttg button{min-width:30px;height:30px;padding:0 8px;border:0;background:transparent;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.note-tools .tg button:hover,.ttg button:hover{background:var(--hv)}
.note-tools .tg button.on,.ttg button.on{background:var(--hv);color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.note-tools select{width:auto;height:30px;padding:0 6px;border:0;background:transparent;border-radius:6px;cursor:pointer}.note-tools select:hover{background:var(--hv)}
.note-tools .tg select+select{border-left:1px solid var(--bd);border-radius:0 6px 6px 0}
.note-tools .lb{display:inline-flex;align-items:center;padding:0 6px;color:var(--mu)}
.note-tools .tg button.sw{width:20px;min-width:20px;height:20px;padding:0;margin:0 2px;border:1px solid rgba(128,128,128,.55);border-radius:50%;transition:transform .1s}
.note-tools .tg button.sw.sq{border-radius:5px}.note-tools .tg button.sw:hover{transform:scale(1.2)}
.note-tools .cc{display:inline-flex;cursor:pointer;margin:0 2px}.note-tools .cc input{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer}
.nh{padding:0!important;gap:8px!important;flex-wrap:wrap}.nh select{width:auto;max-width:100%}
.chk{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin:0}.chk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntr{padding:0!important;flex-wrap:nowrap!important;gap:8px!important}.ntr input{flex:1;min-width:0;font-size:15px;padding:7px 10px}
.na{padding:0!important;gap:8px!important}
.note-editor img,.dx img{max-width:100%;height:auto;border-radius:4px;cursor:pointer;vertical-align:middle}.imgsel{outline:2px solid var(--ac);outline-offset:2px}
.imb{position:fixed;z-index:40;display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.imb button{border:0;background:transparent;padding:4px 8px;font-size:12px;display:inline-flex;align-items:center}.imb .dg{color:#d33}
#cw{position:relative;width:min(720px,100%);max-height:100%;display:flex}
#card{width:100%;max-height:calc(100vh - 24px)}#card>h3:first-child{margin-right:34px}
#mx{position:absolute;top:8px;right:14px;z-index:2;width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2)}
#plan>.ph{max-width:none;position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;margin:-14px -14px 12px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.ph h3{margin:0;flex:1;font-size:16px}
.note-tools .cc input::-webkit-color-swatch-wrapper{padding:0}.note-tools .cc input::-webkit-color-swatch{border:1px solid rgba(128,128,128,.55);border-radius:50%}

/* === rediseño profesional v2 === */
#main{position:relative}
#view.vh{position:absolute;left:0;right:0;top:56px;bottom:0;visibility:hidden;pointer-events:none;overflow:hidden}
button{border-radius:8px;font-weight:500;transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
.bt{white-space:nowrap}
/* barra superior */
#bar{gap:8px;padding:8px 14px;min-height:54px;background:var(--bg)}
#bar>div.seg,#bar>.pill{flex:none}
#bar button{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;background:transparent;border:1px solid transparent;color:var(--tx);font-size:13px}
#bar button:hover{background:var(--hv)}
#bar button.sq{width:32px;padding:0}
#bar button:disabled{opacity:.35;background:transparent}
#bar button.p{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}#bar button.p:hover{filter:brightness(1.1)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px}
#bar .seg button{height:26px;border-radius:7px;padding:0 10px;color:var(--mu)}
#bar .seg button.on{background:var(--bg);color:var(--tx);border-color:var(--bd);box-shadow:0 1px 2px rgba(0,0,0,.14)}
#bar .seg button.on .ico{color:var(--ac)}
.pill{align-items:center;gap:1px;padding:2px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px}
#zm,#hlb,#nav{display:inline-flex}
#bar .pill button{height:26px;min-width:26px;padding:0 7px;border-radius:7px}
.swc{width:16px!important;min-width:16px!important;height:16px!important;padding:0!important;border-radius:50%!important;background:var(--c)!important;border:2px solid var(--bg)!important;box-shadow:0 0 0 1px var(--bd);margin:0 4px;flex:none}
.swc:hover{transform:scale(1.2)}
#hlp .swc{margin:4px}
#title{font-size:14px;font-weight:600;letter-spacing:-.01em}
@media(max-width:1180px){#bar .bt{display:none}#bar #bNote .bt{display:inline}}
@media(max-width:900px){#bar #bNote .bt{display:none}#bar #bNote{width:32px;padding:0}}
/* barra lateral */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#d46bff);color:#fff;box-shadow:0 2px 6px rgba(109,74,255,.35)}.logo .ico{width:15px;height:15px}
.sd-main{display:flex;gap:6px;padding:6px 12px 4px}
.sd-main button{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600}
.sd-main #bFolder{flex:1}.sd-main #bFiles{flex:none;padding:0 12px}
.sd-add,.sd-cloud{display:flex;align-items:center;gap:4px;padding:3px 12px;flex-wrap:wrap}
.sd-cloud:empty{display:none}.sd-add .sp{flex:1}
.sd-add button,.sd-cloud button{height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--tx);border:1px solid var(--bd);padding:0 10px;font-size:13px;position:relative}
.sd-cloud button{flex:1;padding:0 6px}
#sdu{display:inline-flex;gap:1px}
#sdu button{width:30px;padding:0;border-color:transparent;color:var(--mu)}
.sd-add button:hover,.sd-cloud button:hover{background:var(--hv);color:var(--ac)}
.cnt{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--ac);color:#fff;font:600 10px/15px system-ui;text-align:center;font-style:normal;padding:0 3px}
.sd-search{margin:8px 12px 4px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--mu)}
.sd-search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(109,74,255,.15)}
.sd-search input[type=text]{border:0;background:transparent;padding:7px 0;outline:none;border-radius:0}
.sd-search .ico{width:15px;height:15px}
#bClr{background:transparent;border-color:transparent;color:var(--mu);font-size:12px}#bClr:hover{color:#d33}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.09em;padding:10px 8px 3px}
.it{padding:5px 8px;border-radius:7px}
[data-sec].sdt{box-shadow:inset 0 3px 0 var(--ac)}[data-sec].sdb{box-shadow:inset 0 -3px 0 var(--ac)}
.sec .grip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;margin-left:2px;border:0;background:transparent;color:var(--mu);cursor:grab;opacity:.45;border-radius:6px}
.sec:hover .grip,.grip:focus-visible{opacity:1}.grip:hover{background:var(--hv);color:var(--ac)}.grip:active{cursor:grabbing}.grip .ico{width:14px;height:14px}
/* barra de formato adaptable al ancho de la nota */
.note{container:note/inline-size}
.note-tools{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border-radius:10px}
.note-tools .rw{display:contents}
.note-tools .tt{display:none;height:28px;align-items:center;gap:6px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);font-size:12px}
.note-tools.open .tt .ico:last-child{transform:rotate(180deg)}
.note-tools .tg{margin:0}
#n3 .bs{display:none}
@container note (max-width:600px){
  .note-tools .tg button,.ttg button{min-width:26px;height:26px;padding:0 5px}
  .note-tools select{height:26px;font-size:12px;max-width:96px}
  .note-tools .tg button.sw{width:16px;min-width:16px;height:16px}
  .note-tools .lb{display:none}
  .note .bt{display:none}.note #n3 .bt,.note #nx .bt{display:none}
  .note{padding:8px;gap:6px}
}
@container note (max-width:420px){
  .note-tools .tt{display:inline-flex}
  .note-tools:not(.open) .tg{display:none}
  .note-editor{min-height:160px;padding:9px}
}
/* calendario */
.cal{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:12px 0;background:var(--bg)}
.cal-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd)}
.cal-h b{flex:1;font-size:14px}.cal-h b::first-letter{text-transform:uppercase}

.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-g>div{min-height:66px;padding:4px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:12px;cursor:pointer;overflow:hidden}

.cal-g>div:hover{background:var(--hv)}
.cal-g .dw{min-height:0;cursor:default;color:var(--mu);text-align:center;font-size:11px;font-weight:600;background:var(--bg2);padding:5px 0}.cal-g .dw:hover{background:var(--bg2)}
.cal-g .o{background:var(--bg2);cursor:default;opacity:.5}
.cal-g .n{display:inline-block;min-width:20px;text-align:center;border-radius:10px;color:var(--mu)}
.cal-g .t .n{background:var(--ac);color:#fff}
.cal-g .sel{background:var(--hv);box-shadow:inset 0 0 0 2px var(--ac)}
.ex{display:block;margin-top:2px;padding:1px 6px;border-radius:5px;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.mo{display:block;color:var(--mu);font-size:10px;margin-top:1px}
.wk{margin:14px 0 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
@media(max-width:760px){.cal-g>div{min-height:52px}.ex{font-size:10px;padding:0 3px}}
</style>

<body>
<div id="app">
  <aside id="side">

  const shrink=src=>new Promise(ok=>{const im=new Image();im.onload=()=>{try{const M=1200,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))}catch(e){ok(null)}};im.onerror=()=>ok(null);im.src=src});
  let ch=0,saved=0;
  for(const id of Object.keys(notes)){const n=notes[id];if(!n||n.o||(cur&&cur.note===id))continue;
    if(!/<img/i.test(n.body||"")){n.o=1;continue}
    const d=new DOMParser().parseFromString(n.body,"text/html");let mod=0;
    for(const im of d.querySelectorAll('img[src^="data:image/"]')){const o=im.getAttribute("src");if(o.length<150000)continue;const u=await shrink(o);if(u&&u.length<o.length*.85){saved+=o.length-u.length;im.setAttribute("src",u);mod=1}await new Promise(r=>setTimeout(r,30))}
    if(mod){n.body=d.body.innerHTML;ch=1}n.o=1}
  if(ch){save("notes",notes);try{toast("✔ Notas optimizadas: "+Math.round(saved/1024/1024*10)/10+" MB menos")}catch(e){}}else save("notes",notes)}
setTimeout(()=>{try{optimizeNotes()}catch(e){}},6000);
addEventListener("pagehide",()=>{if(sT){clearTimeout(sT);save("notes",notes)}});

const AIC=()=>{let c={};try{c=JSON.parse(localStorage.getItem("aicfg")||"{}")}catch(e){}

const AIS=c=>{try{localStorage.setItem("aicfg",JSON.stringify(c))}catch(e){}};
const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h.toString(36)+t.length};
function aiCache(k,v){try{let a=JSON.parse(localStorage.getItem("aicache")||"[]");
  if(v===undefined){const e=a.find(x=>x.k===k);return e&&e.v}
  a=a.filter(x=>x.k!==k);a.push({k,v});localStorage.setItem("aicache",JSON.stringify(a.slice(-8)))}catch(e){}}
function addUse(i,o){try{const u=JSON.parse(localStorage.getItem("aiuse")||'{"i":0,"o":0}');u.i+=i||0;u.o+=o||0;localStorage.setItem("aiuse",JSON.stringify(u));toast("Tokens: "+(i||0)+" entrada · "+(o||0)+" salida")}catch(e){}}
async function apiJson(p,o={}){
  const c=AIC(),id=c.act,P=PROV[id],k=(c.keys[id]||"").trim();
  if(!k)throw{message:"Pulsa 🔑 y pega tu clave de API de "+P.n+" (o elige otro proveedor)."};
  const m=c.models[id]||P.m,ck=id+"|"+m+"|"+hash(p);
  if(o.cache){const h=aiCache(ck);if(h){toast("Resultado guardado: 0 tokens gastados");return h}}
  const q=P.rq(k,m,p,o.max||2500),pay={url:q.url,headers:{"content-type":"application/json",...q.h},body:JSON.stringify(q.b)};
  let r;
  try{
    if(window.estudio&&estudio.aiCall)r=await estudio.aiCall(pay);
    else{const x=await fetch(pay.url,{method:"POST",headers:pay.headers,body:pay.body});r={ok:x.ok,status:x.status,text:await x.text()}}
  }catch(e){throw{message:"No se pudo conectar con "+P.n+" (revisa tu internet)."}}
  if(r.status===0)throw{message:"No se pudo conectar con "+P.n+": "+String(r.text).slice(0,120)};
  let j={};try{j=JSON.parse(r.text)}catch(e){}
  if(!r.ok){const er=j.error||(j[0]&&j[0].error)||{};throw{message:P.n+": "+(er.message||(typeof er==="string"?er:"")||String(r.text).slice(0,160)||"error "+r.status)}}
  const u=P.us(j);if(u)addUse(u[0],u[1]);
  const t=P.tx(j).replace(/```json|```/g,"").trim();let d;
  try{d=JSON.parse(t)}catch(e){const mm=t.match(/\{[\s\S]*\}/);if(!mm)throw{message:"La respuesta no fue JSON válido. Intenta de nuevo."};
    try{d=JSON.parse(mm[0])}catch(e2){throw{message:"La respuesta llegó cortada. Pide menos tarjetas o un rango menor."}}}
  if(o.cache)aiCache(ck,d);
  return d;
}

async function addFiles(list,pre){
  const recs=[];
  for(const f of list){const path=(pre?pre+"/":"")+(f.webkitRelativePath||f.name),ext=reg(path,f);if(OK.includes(ext)||REXT.includes(ext))recs.push({path,file:f})}
  drawTree();st("Guardando…");
  if(window.estudio){await estudio.addFiles(recs.map(r=>({rel:r.path,src:estudio.pathOf(r.file)})));await loadLib();return}
  const db=await DB;if(!db)return st("⚠ Este navegador no permite guardar la biblioteca.");
  await new Promise(ok=>{const tx=db.transaction("f","readwrite"),s=tx.objectStore("f");recs.forEach(r=>s.put(r));tx.oncomplete=()=>ok();tx.onabort=()=>{st("⚠ Sin espacio: no se guardó todo.");ok()}});
  if(!/⚠/.test($("#st").textContent))st();
}

/* ---------- HTML: codificación, recursos relativos y scripts ---------- */
async function decode(file){
  const u=new Uint8Array(await file.arrayBuffer());
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder("utf-16le").decode(u);
  const m=new TextDecoder("latin1").decode(u.slice(0,3000)).match(/charset\s*=\s*["']?([\w-]+)/i);
  const cs=m?m[1]:"utf-8";
  try{return new TextDecoder(cs,{fatal:/^utf-?8$/i.test(cs)}).decode(u)}catch(e){return new TextDecoder("windows-1252").decode(u)}
}
let INL=0;
const du=async file=>{if(file.url)file=await(await fetch(file.url)).blob();return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r(null);x.readAsDataURL(file)})};
function rel(base,href){
  if(!href||/^(data:|https?:|\/\/|#|mailto:|blob:|javascript:)/i.test(href))return null;
  href=href.split("#")[0].split("?")[0];try{href=decodeURIComponent(href)}catch(e){}
  const p=base.split("/").slice(0,-1);
  for(const s of href.split("/")){if(s==="..")p.pop();else if(s&&s!==".")p.push(s)}
  return res[p.join("/")]||null;
}
async function cssFix(css,path){
  const ms=[...css.matchAll(/url\(\s*['"]?([^'")]+)['"]?\s*\)/g)];
  for(const m of ms){const r=rel(path,m[1]);if(r){const d=await du(r.file);if(d)css=css.replace(m[0],'url("'+d+'")')}}
  return css;
}
async function inlineHtml(f){
  INL=0;const doc=new DOMParser().parseFromString(await decode(f.file),"text/html");
  for(const l of doc.querySelectorAll('link[rel~="stylesheet"][href]')){
    const r=rel(f.path,l.getAttribute("href"));if(!r)continue;
    const s=doc.createElement("style");s.textContent=await cssFix(await decode(r.file),r.path);l.replaceWith(s)}
  for(const im of doc.querySelectorAll("img[src]")){
    const r=rel(f.path,im.getAttribute("src"));if(!r||INL>8e7)continue;const d=await du(r.file);if(d){INL+=d.length;im.src=d;im.removeAttribute("srcset")}}
  if(INL>8e7)toast("⚠ Este HTML tiene muchísimas imágenes: algunas no se cargaron para evitar que la app se cierre");
  for(const s of doc.querySelectorAll("script[src]")){
    const r=rel(f.path,s.getAttribute("src"));if(!r)continue;s.removeAttribute("src");s.textContent=await decode(r.file)}
  for(const s of doc.querySelectorAll("style")){s.textContent=await cssFix(s.textContent,f.path)}
  return doc;
}

     Solución: se inyecta un mini-script que avisa por postMessage y que restaura la posición guardada. */

  hs.textContent='(function(){var Y='+hy+',go=1,T;function se(){return document.scrollingElement||document.documentElement}function P(){try{parent.postMessage({mg:"hscr",y:se().scrollTop},"*")}catch(e){}}'+

function drawTree(){

function node(n,open,dir){
  const fr=document.createDocumentFragment();
  for(const k of Object.keys(n.d).sort()){
    const d=document.createElement("details");const fp=(dir+"/"+k).replace(/^\//,""),ik="fd:"+fp;d.open=open;d.innerHTML="<summary class=\"fs\"><span></span></summary>";const sm=d.firstChild;sm.firstChild.textContent=ic(ik,"📁")+" "+k;sm._ik=ik;sm.dataset.fp=fp;
    const ub=document.createElement("b");ub.className="fb2";ub.textContent="⬆";ub.title="Subir archivos a esta carpeta (o arrástralos encima)";ub.onclick=ev=>{ev.preventDefault();ev.stopPropagation();upDir=fp;$("#iUp").click()};sm.append(ub,icoBtn(ik,"📁"));
    const c=document.createElement("div");c.className="ind";d.append(c);
    const fill=()=>{if(c._f)return;c._f=1;c.append(node(n.d[k],open,dir+"/"+k))};
    if(open)fill();else d.addEventListener("toggle",()=>{if(d.open)fill()});fr.append(d)}
  for(const f of sortBy(n.f,"dir:"+dir,f=>f.path))fr.append(item(ic(f.path,ICON[f.ext]||"🖼️")+" "+f.name,f.path,()=>openFile(f),()=>delFile(f),"dir:"+dir));
  return fr;
}
