name: Compilar MedGod.ipa
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar archivos en carpetas
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset Web app-src
          for f in AppDelegate Bridge ChildWeb Storage; do
            [ -f "$f.swift" ] && mv "$f.swift" Sources/ || true
          done
          [ -f icon-1024.png ] && mv icon-1024.png Sources/Assets.xcassets/AppIcon.appiconset/ || true
          [ -f bridge.js ] && mv bridge.js Web/ || true
          [ -f index.html ] && mv index.html app-src/ || true
          [ -f package.json ] && mv package.json app-src/ || true
          rm -f Contents.json
          echo '{"info":{"author":"xcode","version":1}}' > Sources/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          ls -R Sources Web app-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar la web (librerías + index.html)
        run: bash prepare-web.sh

      - name: Generar proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild -project MedGod.xcodeproj -scheme MedGod -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MedGod.app Payload/
          zip -qr MedGod.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MedGod-ipa
          path: MedGod.ipa
